[project]
name = "clbench"
version = "1.1.0"
description = "ClosedLoopBench (temporal relation discovery under clinical feedback) and feedback-robust patient graphs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "torch>=2.3",
    "pydantic>=2.7",
    "tigramite>=5.2",
    "lingam>=1.9",
    "pygam>=0.9",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "vitaldb>=1.7.2",
    "wfdb>=4.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short"

# Versions used for the paper's runs (Python 3.11.14): see requirements.txt + requirements-nodeps.txt
# (lingam / pygam declare scipy caps that a resolver honours; the paper's environment ran them with scipy 1.17.1).
